<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savva — Specialty Coffee, Madinah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2A331E;
    --surface:#333F24;
    --surface-2:#3D4B2B;
    --ink:#F2EFE3;
    --ink-soft:#B7C0A4;
    --ink-heading:#F7F5EA;
    --line:rgba(247,245,234,.14);
    --accent:#8CA85D;
    --accent-soft:#8CA85D22;
    --accent-copper:#A9673A;
    --primary-ink:#1D2414;
    --shadow:0 20px 50px -14px rgba(0,0,0,.55);
    --shadow-sm:0 8px 22px -8px rgba(0,0,0,.45);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Baloo 2',sans-serif;
    --font-body:'Inter',sans-serif;
    color-scheme:dark;
  }
  html[lang="ar"]{ --font-display:'Baloo Bhaijaan 2',sans-serif; --font-body:'Tajawal',sans-serif; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
    line-height:1.6; font-size:16px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:700; margin:0; color:var(--ink-heading); }
  p{ margin:0; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  img{ max-width:100%; display:block; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .container{ max-width:1160px; margin-inline:auto; padding-inline:24px; }
  @media (max-width:640px){ .container{ padding-inline:18px; } }
  [hidden]{ display:none !important; }

  .eyebrow{ font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  html[lang="ar"] .eyebrow{ letter-spacing:.04em; text-transform:none; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:9px; border-radius:999px;
    padding:14px 28px; font-size:14.5px; font-weight:600; cursor:pointer; border:1px solid transparent;
    transition:transform .18s cubic-bezier(.25,1,.35,1), box-shadow .2s ease, background .2s ease, border-color .2s ease;
    white-space:nowrap; letter-spacing:.02em;
  }
  .btn:active{ transform:scale(1.05); }
  .btn-primary{ background:var(--accent); color:var(--primary-ink); box-shadow:var(--shadow-sm); }
  .btn-primary:hover{ box-shadow:var(--shadow); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-ghost:hover{ background:var(--surface-2); border-color:var(--accent); }
  .btn svg{ width:16px; height:16px; }

  /* ---------- Header ---------- */
  .site-header{
    position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  }
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:16px; }
  .brand{ display:flex; align-items:center; gap:9px; text-decoration:none; }
  .brand svg{ width:24px; height:24px; color:var(--accent); }
  .brand-name{ font-family:var(--font-display); font-weight:600; font-size:24px; letter-spacing:.03em; color:var(--ink-heading); }
  nav.main-nav{ display:flex; align-items:center; gap:28px; }
  nav.main-nav a{
    text-decoration:none; font-size:13.5px; font-weight:600; letter-spacing:.03em; color:var(--ink-soft);
    display:inline-block; transform-origin:center bottom; transition:transform .16s cubic-bezier(.25,1,.35,1), color .15s ease;
  }
  nav.main-nav a:hover{ color:var(--ink-heading); }
  @media (max-width:900px){ nav.main-nav{ display:none; } }
  .header-actions{ display:flex; align-items:center; gap:12px; }
  .lang-switch{ display:flex; gap:2px; padding:3px; border-radius:999px; border:1px solid var(--line); background:var(--surface); }
  .lang-switch button{
    font-size:11px; font-weight:700; letter-spacing:.03em; padding:7px 12px; border-radius:999px; border:none;
    background:transparent; cursor:pointer; color:var(--ink-soft); transition:transform .18s cubic-bezier(.25,1,.35,1), background .15s ease, color .15s ease;
  }
  .lang-switch button[aria-pressed="true"]{ background:var(--accent); color:var(--primary-ink); }
  .hamburger{
    display:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
  }
  .hamburger svg{ width:18px; height:18px; }
  @media (max-width:900px){ .hamburger{ display:inline-flex; } }
  .mobile-nav{ display:none; flex-direction:column; gap:2px; padding:10px 24px 20px; border-top:1px solid var(--line); }
  .mobile-nav.open{ display:flex; }
  .mobile-nav a{ text-decoration:none; color:var(--ink); font-weight:600; padding:13px 4px; border-bottom:1px solid var(--line); font-size:15px; }

  /* ---------- Hero ---------- */
  .hero{
    position:relative; min-height:92vh; display:flex; align-items:center; padding-block:120px 190px;
    overflow:hidden; text-align:center;
    background:radial-gradient(circle at 20% 15%, var(--surface) 0%, transparent 45%),
               radial-gradient(circle at 82% 78%, var(--surface-2) 0%, transparent 50%),
               var(--bg);
  }
  #heroCanvas{ position:absolute; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .hero-glow{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 50% at 50% 30%, rgba(247,245,234,.07) 0%, transparent 70%);
  }
  .hero-inner{ position:relative; z-index:2; max-width:900px; margin-inline:auto; }
  .hero-arabic{ font-family:'Baloo Bhaijaan 2',sans-serif; font-weight:700; font-size:24px; color:var(--ink-soft); margin-bottom:10px; display:block; }
  .hero h1{
    font-size:clamp(84px,19vw,240px); line-height:.92; letter-spacing:-.01em; margin-block:0 22px;
    color:var(--ink-heading); position:relative; z-index:2;
  }
  .hero-lead{ font-size:18px; font-style:italic; color:var(--ink-soft); max-width:44ch; margin:0 auto 34px; font-family:var(--font-body); position:relative; z-index:2; }
  html[lang="ar"] .hero-lead{ font-style:normal; }
  .hero-actions{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; position:relative; z-index:2; }

  /* ---------- Floating drink orbs (real photos) ---------- */
  .hero-orbs{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  .drink-orb{
    position:absolute; will-change:transform; border-radius:50%; overflow:hidden;
    border:3px solid rgba(213,226,208,.55); box-shadow:0 22px 34px -10px rgba(0,0,0,.5);
    animation:orbFloat 10s ease-in-out infinite;
  }
  .drink-orb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .orb-1{ top:8%; left:6%; width:124px; height:124px; z-index:1; opacity:.9; animation-duration:12s; }
  .orb-2{ top:9%; right:7%; width:150px; height:150px; z-index:3; animation-duration:9s; animation-delay:.6s; }
  .orb-3{ bottom:26%; left:10%; width:104px; height:104px; z-index:1; opacity:.85; animation-duration:13s; animation-delay:1.4s; }
  .orb-4{ bottom:9%; right:11%; width:168px; height:168px; z-index:3; animation-duration:11s; animation-delay:.3s; }
  .orb-5{ top:45%; left:47%; width:88px; height:88px; z-index:3; animation-duration:8s; animation-delay:.9s; }
  @keyframes orbFloat{
    0%{ transform:translate(var(--px,0px),var(--py,0px)) translateY(0) rotate(-4deg); }
    50%{ transform:translate(var(--px,0px),var(--py,0px)) translateY(-22px) rotate(3deg); }
    100%{ transform:translate(var(--px,0px),var(--py,0px)) translateY(0) rotate(-4deg); }
  }
  @media (max-width:760px){
    .orb-1{ width:80px; height:80px; } .orb-2{ width:96px; height:96px; }
    .orb-3{ width:66px; height:66px; } .orb-4{ width:104px; height:104px; }
    .orb-5{ width:56px; height:56px; }
  }
  @media (max-width:520px){ .orb-3, .orb-5{ display:none; } }

  /* ---------- Floating glass product card ---------- */
  .hero-float-card{
    position:absolute; left:50%; bottom:34px; transform:translateX(-50%); z-index:4;
    display:flex; align-items:center; gap:16px; padding:14px 22px 14px 14px; max-width:min(92vw,420px);
    background:rgba(247,245,234,.08); backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--menu-border, #D5E2D0); border-radius:20px;
    box-shadow:0 20px 40px -16px rgba(0,0,0,.5);
  }
  .hero-float-media{
    width:64px !important; height:64px !important; border-radius:14px; flex:0 0 auto; overflow:hidden;
    position:relative !important; top:auto !important; left:auto !important; right:auto !important; bottom:auto !important;
    z-index:auto !important; animation:none !important; filter:none !important; opacity:1 !important;
    border:1px solid var(--menu-border, #D5E2D0) !important; box-shadow:none !important;
  }
  .hero-float-info{ text-align:start; min-width:0; }
  .hero-float-info h4{ font-family:var(--font-body); font-size:14.5px; font-weight:700; color:var(--ink-heading); margin-bottom:2px; }
  .hero-float-info p{ font-size:12px; color:var(--ink-soft); margin-bottom:8px; }
  .hero-float-row{ display:flex; align-items:center; gap:10px; }
  .hero-float-note{ font-size:11px; color:var(--ink-soft); font-style:italic; }
  html[lang="ar"] .hero-float-note{ font-style:normal; }
  .hero-float-cta{
    padding:7px 14px; border-radius:999px; border:1px solid var(--ink); background:transparent;
    color:var(--ink-heading); font-size:11px; font-weight:700; cursor:pointer; text-decoration:none;
    transition:transform .18s cubic-bezier(.25,1,.35,1), background .18s ease;
  }
  .hero-float-cta:hover{ background:rgba(247,245,234,.12); }
  .hero-float-cta:active{ transform:scale(1.08); }
  @media (max-width:480px){ .hero-float-card{ bottom:18px; padding:10px 16px 10px 10px; gap:12px; } .hero-float-media{ width:52px; height:52px; } }

  /* ---------- Section shell ---------- */
  section{ padding-block:80px; }
  .section-head{ max-width:620px; margin-bottom:44px; }
  .section-head.center{ margin-inline:auto; text-align:center; }
  .section-head h2{ font-size:clamp(30px,4vw,42px); margin-top:10px; }
  .section-head p{ color:var(--ink-soft); margin-top:14px; font-size:15.5px; }

  .divider{ display:flex; align-items:center; justify-content:center; gap:16px; }
  .divider::before, .divider::after{ content:""; flex:1; max-width:200px; height:1px; background:linear-gradient(90deg, transparent, var(--accent), transparent); opacity:.5; }
  .divider-mark{ width:6px; height:6px; background:var(--accent); transform:rotate(45deg); flex:0 0 auto; }

  [data-reveal]{ opacity:0; transform:translateY(26px); transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1); }
  [data-reveal].revealed{ opacity:1; transform:translateY(0); }

  /* ---------- Concept ---------- */
  .concept-grid{ display:grid; grid-template-columns:1fr 1fr; gap:52px; align-items:center; }
  @media (max-width:820px){ .concept-grid{ grid-template-columns:1fr; } }
  .concept-text p{ color:var(--ink-soft); font-size:15.5px; margin-bottom:16px; }
  .concept-chips{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
  .concept-chip{
    display:flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); font-size:12.5px; color:var(--ink-soft); font-weight:600;
  }
  .concept-chip svg{ width:15px; height:15px; color:var(--accent); }
  .concept-visual{
    aspect-ratio:1/1; border-radius:var(--radius-lg); border:1px solid var(--line);
    overflow:hidden; position:relative;
  }
  .concept-visual img{ width:100%; height:100%; object-fit:cover; }

  /* ---------- Menu ---------- */
  /* ---------- Menu: white "island" section with light-green-outlined cards ---------- */
  #menu{
    background:#FFFFFF; border-radius:32px; margin-inline:12px; padding-inline:20px;
    --menu-border:#D5E2D0; --menu-accent:#5E7F52; --menu-ink:#111111; --menu-ink-soft:#7C8A76;
  }
  #menu .eyebrow{ color:var(--menu-accent); }
  #menu .section-head h2{ color:var(--menu-ink); }
  #menu .section-head p{ color:var(--menu-ink-soft); }
  .menu-tabs{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:36px; }
  .menu-tab{
    padding:11px 22px; border-radius:999px; border:1px solid var(--menu-border); background:#FFFFFF;
    color:var(--menu-ink-soft); font-size:13.5px; font-weight:700; cursor:pointer;
    transition:transform .18s cubic-bezier(.25,1,.35,1), background .18s ease, color .18s ease, border-color .18s ease;
  }
  .menu-tab[aria-pressed="true"]{ background:var(--menu-accent); color:#FFFFFF; border-color:var(--menu-accent); transform:scale(1.06); }
  .menu-tab:active{ transform:scale(1.1); }
  .drink-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:32px; }
  @media (max-width:900px){ .drink-grid{ grid-template-columns:repeat(2,1fr); gap:24px; } }
  @media (max-width:520px){ .drink-grid{ grid-template-columns:1fr; } }
  .drink-card{
    border-radius:20px; padding:36px 26px 30px; border:1px solid var(--menu-border); background:#FFFFFF;
    text-align:center; transition:transform .22s cubic-bezier(.25,1,.35,1), box-shadow .22s ease;
    display:flex; flex-direction:column; align-items:center;
  }
  .drink-card:hover{ transform:translateY(-5px); box-shadow:0 16px 34px -18px rgba(94,127,82,.35); }
  .drink-icon{
    width:150px; height:150px; border-radius:50%; margin-bottom:26px; overflow:hidden;
    background:#F4F7F1; display:flex; align-items:center; justify-content:center;
  }
  .drink-icon img{ width:100%; height:100%; object-fit:cover; }
  .drink-card h4{ font-family:var(--font-body); font-size:20px; font-weight:700; margin-bottom:8px; color:var(--menu-ink); }
  .drink-card p{ font-size:13.5px; color:var(--menu-ink-soft); margin-bottom:22px; }
  .drink-btn{
    display:inline-flex; align-items:center; justify-content:center; margin-top:auto; text-decoration:none;
    padding:10px 22px; border-radius:999px; border:1px solid var(--menu-border); background:transparent;
    color:var(--menu-accent); font-size:12.5px; font-weight:700; letter-spacing:.02em;
    transition:transform .18s cubic-bezier(.25,1,.35,1), background .18s ease;
  }
  .drink-btn:hover{ background:#F4F7F1; }
  .drink-btn:active{ transform:scale(1.06); }
  .menu-food-note{
    display:flex; align-items:center; justify-content:center; gap:10px; margin-top:40px; padding-top:28px;
    border-top:1px solid var(--menu-border); font-size:14px; color:var(--menu-ink-soft); flex-wrap:wrap; text-align:center;
  }
  .menu-food-note svg{ width:18px; height:18px; color:var(--menu-accent); flex:0 0 auto; }
  .menu-food-note b{ color:var(--menu-ink); }
  .menu-note{
    text-align:center; margin-top:22px; font-size:13.5px; color:var(--menu-ink-soft); font-style:italic;
  }
  html[lang="ar"] .menu-note{ font-style:normal; }

  /* ---------- Atmosphere ---------- */
  .mood-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; }
  @media (max-width:820px){ .mood-grid{ grid-template-columns:1fr; } }
  .mood-card{
    aspect-ratio:3/4; border-radius:var(--radius-lg); position:relative; overflow:hidden; border:1px solid var(--line);
    display:flex; align-items:flex-end; padding:24px;
  }
  .mood-card span{ font-family:var(--font-display); font-size:22px; color:var(--ink-heading); position:relative; z-index:2; }
  .mood-bg{ position:absolute; inset:0; z-index:1; animation:moodDrift 14s ease-in-out infinite alternate; background-size:200% 200%; }
  .mood-card.gold .mood-bg{ background-image:radial-gradient(circle at 30% 70%, #7A5A2C, #1B120D 75%); }
  .mood-card.terrace .mood-bg{ background-image:radial-gradient(circle at 70% 30%, #3E4A2E, #1B120D 75%); }
  .mood-card.night .mood-bg{ background-image:radial-gradient(circle at 50% 80%, #3A2A4A, #1B120D 75%); }
  @keyframes moodDrift{ 0%{ background-position:0% 0%; } 100%{ background-position:100% 100%; } }
  @media (prefers-reduced-motion: reduce){ .mood-bg{ animation:none; } }

  /* ---------- Visit ---------- */
  .visit-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:40px;
    max-width:640px; margin-inline:auto; text-align:center; box-shadow:var(--shadow-sm);
  }
  .visit-row{ display:flex; align-items:flex-start; gap:14px; justify-content:center; margin-bottom:18px; text-align:start; max-width:420px; margin-inline:auto; }
  .visit-row svg{ width:20px; height:20px; color:var(--accent); flex:0 0 auto; margin-top:2px; }
  .visit-row b{ display:block; font-size:14.5px; margin-bottom:2px; }
  .visit-row span{ font-size:13.5px; color:var(--ink-soft); }
  .visit-note{ font-size:12px; color:var(--ink-soft); font-style:italic; margin-top:6px; }
  html[lang="ar"] .visit-note{ font-style:normal; }

  /* ---------- Follow ---------- */
  .follow-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:640px; margin-inline:auto; }
  @media (max-width:560px){ .follow-grid{ grid-template-columns:1fr; } }
  .follow-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:28px;
    text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .follow-card svg{ width:30px; height:30px; color:var(--accent); }
  .follow-card h4{ font-size:17px; }
  .follow-card p{ font-size:13px; color:var(--ink-soft); }

  footer.site-footer{ padding:44px 0 30px; border-top:1px solid var(--line); }
  .footer-grid{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:24px; margin-bottom:24px; }
  .footer-col h5{ font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; font-weight:700; }
  html[lang="ar"] .footer-col h5{ letter-spacing:.02em; text-transform:none; }
  .footer-col p, .footer-col a{ font-size:13.5px; color:var(--ink-soft); text-decoration:none; display:block; margin-bottom:4px; }
  footer.site-footer .bottom{ font-size:12px; color:var(--ink-soft); text-align:center; padding-top:20px; border-top:1px solid var(--line); }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
  }
</style>
</head>

  // own Instagram posts and highlights (see README). No prices anywhere
  // were ever posted, so none are shown — never invented.
  var MENU_ITEMS = [
    { cat:"drink", img:"img/ice-hibiscus.jpg", nameKey:"menuIcedHibiscus", descKey:"menuIcedHibiscusDesc" },
    { cat:"drink", img:"img/matcha-berry.jpg", nameKey:"menuMatchaBerry", descKey:"menuMatchaBerryDesc" },
    { cat:"drink", img:"img/melon.jpg", nameKey:"menuMelon", descKey:"menuMelonDesc" },
    { cat:"drink", img:"img/freddo.jpg", nameKey:"menuFreddo", descKey:"menuFreddoDesc" },
    { cat:"dessert", img:"img/blueberry-cheesecake.jpg", nameKey:"menuBlueberryCheesecake", descKey:"menuBlueberryCheesecakeDesc" },
    { cat:"dessert", img:"img/cinnabon-danish.jpg", nameKey:"menuCinnabonDanish", descKey:"menuCinnabonDanishDesc" },
    { cat:"dessert", img:"img/madini-cookies.jpg", nameKey:"menuMadiniCookies", descKey:"menuMadiniCookiesDesc" },
    { cat:"dessert", img:"img/chocolate-caramel-cake.jpg", nameKey:"menuChocCake", descKey:"menuChocCakeDesc" },
    { cat:"dessert", img:"img/kunafa.jpg", nameKey:"menuKunafa", descKey:"menuKunafaDesc" }
  ];
  var activeMenuCat = "drink";

  var state = { lang:"en" };
  try{
    var saved = localStorage.getItem("savva_lang");
    if(saved === "en" || saved === "ar") state.lang = saved;
  }catch(e){}

  function t(key){
    var dict = STRINGS[state.lang] || STRINGS.en;
    return dict[key] !== undefined ? dict[key] : (STRINGS.en[key] || "");
  }

  var ICON_VIEWBOX = {
    "i-cup":"0 0 24 24","i-pin":"0 0 24 24","i-clock":"0 0 24 24","i-phone":"0 0 24 24",
    "i-instagram":"0 0 24 24","i-music":"0 0 24 24","i-users":"0 0 24 24","i-trees":"0 0 24 24",
    "i-leaf":"0 0 24 24","i-arrow":"0 0 24 24","i-menu":"0 0 24 24","i-close":"0 0 24 24"
  };
  function hydrateIcons(root){
    if(!root) return;
    root.querySelectorAll("svg").forEach(function(svg){
      var use = svg.querySelector("use");
      if(!use) return;
      var id = use.getAttribute("href").replace("#","");
      if(ICON_VIEWBOX[id] && !svg.getAttribute("viewBox")) svg.setAttribute("viewBox", ICON_VIEWBOX[id]);
    });
  }

  function applyLanguage(){
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("#langSwitch button").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === state.lang ? "true" : "false");
    });
    try{ localStorage.setItem("savva_lang", state.lang); }catch(e){}
  }

  /* =====================================================
     DRINK MENU — tabbed category grid
     ===================================================== */
  function renderDrinks(){
    var wrap = document.getElementById("drinkGrid");
    var html = MENU_ITEMS.filter(function(d){ return d.cat === activeMenuCat; }).map(function(d){
      return '<div class="drink-card">' +
        '<div class="drink-icon"><img src="' + d.img + '" alt="" loading="lazy"></div>' +
        '<h4>' + t(d.nameKey) + '</h4><p>' + t(d.descKey) + '</p>' +
        '<a class="drink-btn" href="https://www.instagram.com/savva_cafe" target="_blank" rel="noopener">' + t("drinkCta") + '</a>' +
        '</div>';
    }).join('');
    wrap.innerHTML = html;
    hydrateIcons(wrap);
  }
  document.getElementById("menuTabs").addEventListener("click", function(e){
    var btn = e.target.closest(".menu-tab");
    if(!btn) return;
    activeMenuCat = btn.getAttribute("data-cat");
    document.querySelectorAll("#menuTabs .menu-tab").forEach(function(b){
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    renderDrinks();
  });

  document.getElementById("langSwitch").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-lang]");
    if(!btn) return;
    state.lang = btn.getAttribute("data-lang");
    applyLanguage();
    renderDrinks();
  });

  var hamburgerBtn = document.getElementById("hamburgerBtn");
  var mobileNav = document.getElementById("mobileNav");
  hamburgerBtn.addEventListener("click", function(){
    var open = mobileNav.classList.toggle("open");
    hamburgerBtn.innerHTML = '<svg><use href="#' + (open ? "i-close" : "i-menu") + '"/></svg>';
    hydrateIcons(hamburgerBtn);
  });
  mobileNav.querySelectorAll("a").forEach(function(a){
    a.addEventListener("click", function(){
      mobileNav.classList.remove("open");
      hamburgerBtn.innerHTML = '<svg><use href="#i-menu"/></svg>';
      hydrateIcons(hamburgerBtn);
    });
  });

  document.getElementById("heroDirectionsBtn").href = MAPS_URL;
  document.getElementById("visitDirectionsBtn").href = MAPS_URL;

  /* =====================================================
     NAV MAGNIFY — same dock-lens technique as body-sculptor
     ===================================================== */
  function initNavMagnify(){
    var nav = document.querySelector("nav.main-nav");
    if(!nav) return;
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduceMotion) return;
    var MAX_SCALE = 1.4, RADIUS = 85;
    nav.addEventListener("mousemove", function(e){
      nav.querySelectorAll("a").forEach(function(link){
        var rect = link.getBoundingClientRect();
        var center = rect.left + rect.width / 2;
        var dist = Math.abs(e.clientX - center);
        var scale = dist < RADIUS ? 1 + (MAX_SCALE - 1) * (1 - dist / RADIUS) : 1;
        link.style.transform = "scale(" + scale.toFixed(3) + ")";
      });
    });
    nav.addEventListener("mouseleave", function(){
      nav.querySelectorAll("a").forEach(function(link){ link.style.transform = "scale(1)"; });
    });
  }

  /* =====================================================
     HERO CANVAS — rising steam/ember particles, slow drift,
     gentle pointer parallax. Same recipe as body-sculptor's
     atmosphere effect (canvas 2D, DPR clamp, reduced-motion
     guard) with a different motif suited to a coffee house.
     ===================================================== */
  function initHeroCanvas(){
    var canvas = document.getElementById("heroCanvas");
    if(!canvas || !canvas.getContext) return;
    var ctx = canvas.getContext("2d");
    if(!ctx) return;

    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = 0, h = 0;
    var pointer = { x:0.5, y:0.5 };
    var driftX = 0;

    var accentHex = (getComputedStyle(document.documentElement).getPropertyValue("--accent") || "#C6A15B").trim();
    var m = /^#([0-9a-f]{6})$/i.exec(accentHex);
    var rgbStr = m ? [parseInt(m[1].slice(0,2),16), parseInt(m[1].slice(2,4),16), parseInt(m[1].slice(4,6),16)].join(",") : "198,161,91";

    var N = 46;
    var particles = [];
    function resetParticle(p, initial){
      p.x = Math.random();
      p.y = initial ? Math.random() : 1.15;
      p.size = 10 + Math.random() * 26;
      p.speed = 0.02 + Math.random() * 0.035;
      p.sway = 0.15 + Math.random() * 0.35;
      p.phase = Math.random() * Math.PI * 2;
      p.alpha = 0.05 + Math.random() * 0.13;
    }
    for(var i = 0; i < N; i++){ var p = {}; resetParticle(p, true); particles.push(p); }

    function resize(){
      var rect = canvas.parentElement.getBoundingClientRect();
      w = rect.width; h = rect.height;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize);

    function draw(now){
      var t = now / 1000;
      var targetDx = (pointer.x - 0.5) * 18;
      driftX += (targetDx - driftX) * 0.02;

      ctx.clearRect(0, 0, w, h);
      particles.forEach(function(p){
        p.y -= p.speed * 0.016;
        if(p.y < -0.08){ resetParticle(p, false); }
        var px = (p.x + Math.sin(t * 0.25 + p.phase) * p.sway * 0.05) * w + driftX;
        var py = p.y * h;
        var grd = ctx.createRadialGradient(px, py, 0, px, py, p.size);
        grd.addColorStop(0, "rgba(" + rgbStr + "," + p.alpha + ")");
        grd.addColorStop(1, "rgba(" + rgbStr + ",0)");
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      if(!reduceMotion) requestAnimationFrame(draw);
    }

    if(reduceMotion){
      draw(0);
    } else {
      canvas.parentElement.addEventListener("pointermove", function(e){
        var rect = canvas.parentElement.getBoundingClientRect();
        pointer.x = (e.clientX - rect.left) / rect.width;
      });
      requestAnimationFrame(draw);
    }
  }

  /* =====================================================
     HERO ORB PARALLAX — the floating drinks drift gently
     toward the cursor, closer orbs (higher data-depth) move
     more, so the composition reads as layered/3D. Smoothed
     with the same lerp approach as the canvas drift above,
     layered on top of each orb's own CSS float animation.
     ===================================================== */
  function initHeroOrbParallax(){
    var wrap = document.getElementById("heroOrbs");
    if(!wrap) return;
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduceMotion) return;
    var orbs = Array.prototype.slice.call(wrap.querySelectorAll(".drink-orb")).map(function(el){
      return { el:el, depth:parseFloat(el.getAttribute("data-depth")) || 0.5, x:0, y:0 };
    });
    var target = { x:0, y:0 };
    var hero = wrap.parentElement;

    hero.addEventListener("pointermove", function(e){
      var rect = hero.getBoundingClientRect();
      target.x = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
      target.y = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
    });
    hero.addEventListener("pointerleave", function(){ target.x = 0; target.y = 0; });

    function tick(){
      orbs.forEach(function(o){
        o.x += (target.x * o.depth * 16 - o.x) * 0.05;
        o.y += (target.y * o.depth * 12 - o.y) * 0.05;
        o.el.style.setProperty("--px", o.x.toFixed(2) + "px");
        o.el.style.setProperty("--py", o.y.toFixed(2) + "px");
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* =====================================================
     SCROLL REVEAL — fade+rise sections into view once
     ===================================================== */
  function initScrollReveal(){
    var els = document.querySelectorAll("[data-reveal]");
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!("IntersectionObserver" in window) || reduceMotion){
      els.forEach(function(el){ el.classList.add("revealed"); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){ entry.target.classList.add("revealed"); io.unobserve(entry.target); }
      });
    }, { threshold:0.15 });
    els.forEach(function(el){ io.observe(el); });
  }

  document.getElementById("year").textContent = new Date().getFullYear();
  hydrateIcons(document);
  applyLanguage();
  renderDrinks();
  initNavMagnify();
  initHeroCanvas();
  initHeroOrbParallax();
  initScrollReveal();
})();
</script>
</body>
