<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Savva — Specialty Coffee, Madinah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2A331E;
    --surface:#333F24;
    --surface-2:#3D4B2B;
    --ink:#F2EFE3;
    --ink-soft:#B7C0A4;
    --ink-heading:#F7F5EA;
    --line:rgba(247,245,234,.14);
    --accent:#8CA85D;
    --accent-soft:#8CA85D22;
    --accent-copper:#A9673A;
    --primary-ink:#1D2414;
    --shadow:0 20px 50px -14px rgba(0,0,0,.55);
    --shadow-sm:0 8px 22px -8px rgba(0,0,0,.45);
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --font-display:'Baloo 2',sans-serif;
    --font-body:'Inter',sans-serif;
    color-scheme:dark;
  }
  html[lang="ar"]{ --font-display:'Baloo Bhaijaan 2',sans-serif; --font-body:'Tajawal',sans-serif; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body);
    line-height:1.6; font-size:16px; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  }
  h1,h2,h3,h4{ font-family:var(--font-display); font-weight:700; margin:0; color:var(--ink-heading); }
  p{ margin:0; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  img{ max-width:100%; display:block; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .container{ max-width:1160px; margin-inline:auto; padding-inline:24px; }
  @media (max-width:640px){ .container{ padding-inline:18px; } }
  [hidden]{ display:none !important; }

  .eyebrow{ font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  html[lang="ar"] .eyebrow{ letter-spacing:.04em; text-transform:none; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:9px; border-radius:999px;
    padding:14px 28px; font-size:14.5px; font-weight:600; cursor:pointer; border:1px solid transparent;
    transition:transform .18s cubic-bezier(.25,1,.35,1), box-shadow .2s ease, background .2s ease, border-color .2s ease;
    white-space:nowrap; letter-spacing:.02em; text-decoration:none;
  }
  .btn:active{ transform:scale(1.05); }
  .btn-primary{ background:var(--accent); color:var(--primary-ink); box-shadow:var(--shadow-sm); }
  .btn-primary:hover{ box-shadow:var(--shadow); }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
  .btn-ghost:hover{ background:var(--surface-2); border-color:var(--accent); }
  .btn svg{ width:16px; height:16px; }

  /* ---------- Header ---------- */
  .site-header{
    position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
  }
  .header-row{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:16px; }
  .brand{ display:flex; align-items:center; gap:9px; text-decoration:none; }
  .brand svg{ width:24px; height:24px; color:var(--accent); }
  .brand-name{ font-family:var(--font-display); font-weight:600; font-size:24px; letter-spacing:.03em; color:var(--ink-heading); }
  nav.main-nav{ display:flex; align-items:center; gap:28px; }
  nav.main-nav a{
    text-decoration:none; font-size:13.5px; font-weight:600; letter-spacing:.03em; color:var(--ink-soft);
    display:inline-block; transform-origin:center bottom; transition:transform .16s cubic-bezier(.25,1,.35,1), color .15s ease;
  }
  nav.main-nav a:hover{ color:var(--ink-heading); }
  @media (max-width:900px){ nav.main-nav{ display:none; } }
  .header-actions{ display:flex; align-items:center; gap:12px; }
  .order-now-btn{ padding:10px 20px; font-size:13px; }
  @media (max-width:420px){ .order-now-btn{ padding:9px 14px; font-size:12px; } }
  .lang-switch{ display:flex; gap:2px; padding:3px; border-radius:999px; border:1px solid var(--line); background:var(--surface); }
  .lang-switch button{
    font-size:11px; font-weight:700; letter-spacing:.03em; padding:7px 12px; border-radius:999px; border:none;
    background:transparent; cursor:pointer; color:var(--ink-soft); transition:transform .18s cubic-bezier(.25,1,.35,1), background .15s ease, color .15s ease;
  }
  .lang-switch button[aria-pressed="true"]{ background:var(--accent); color:var(--primary-ink); }
  .hamburger{
    display:none; width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--surface);
    align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
  }
  .hamburger svg{ width:18px; height:18px; }
  @media (max-width:900px){ .hamburger{ display:inline-flex; } }
  .mobile-nav{ display:none; flex-direction:column; gap:2px; padding:10px 24px 20px; border-top:1px solid var(--line); }
  .mobile-nav.open{ display:flex; }
  .mobile-nav a{ text-decoration:none; color:var(--ink); font-weight:600; padding:13px 4px; border-bottom:1px solid var(--line); font-size:15px; }

  /* ---------- Hero ---------- */
  .hero{
    position:relative; min-height:92vh; display:flex; align-items:center; padding-block:120px;
    overflow:hidden; text-align:center;
    background:radial-gradient(circle at 20% 15%, var(--surface) 0%, transparent 45%),
               radial-gradient(circle at 82% 78%, var(--surface-2) 0%, transparent 50%),
               var(--bg);
  }
  .hero-glow{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 50% at 50% 30%, rgba(247,245,234,.07) 0%, transparent 70%);
  }
  .hero-inner{ position:relative; z-index:2; max-width:900px; margin-inline:auto; }
  .hero-arabic{ font-family:'Baloo Bhaijaan 2',sans-serif; font-weight:700; font-size:24px; color:var(--ink-soft); margin-bottom:10px; display:block; }
  .hero h1{
    font-size:clamp(84px,19vw,240px); line-height:.92; letter-spacing:-.01em; margin-block:0 22px;
    color:var(--ink-heading); position:relative; z-index:2;
  }
  .hero-lead{ font-size:18px; font-style:italic; color:var(--ink-soft); max-width:44ch; margin:0 auto; font-family:var(--font-body); position:relative; z-index:2; }
  html[lang="ar"] .hero-lead{ font-style:normal; }

  /* ---------- Floating drinks (real photos, cutout, full-height, no frame) ---------- */
  .hero-orbs{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  .drink-orb{
    position:absolute; will-change:transform;
    animation:orbFloat 10s ease-in-out infinite;
  }
  .drink-orb img{
    display:block; width:auto; object-fit:contain;
    filter:drop-shadow(0 22px 26px rgba(0,0,0,.45));
  }
  .orb-1{ top:6%; left:5%; height:230px; z-index:1; opacity:.92; animation-duration:12s; }
  .orb-2{ top:7%; right:5%; height:270px; z-index:3; animation-duration:9s; animation-delay:.6s; }
  .orb-3{ bottom:22%; left:7%; height:190px; z-index:1; opacity:.88; animation-duration:13s; animation-delay:1.4s; }
  .orb-4{ bottom:6%; right:8%; height:300px; z-index:3; animation-duration:11s; animation-delay:.3s; }
  .orb-5{ bottom:7%; left:40%; height:150px; z-index:1; opacity:.85; animation-duration:8s; animation-delay:.9s; }
  .drink-orb img{ height:100%; }
  @keyframes orbFloat{
    0%{ transform:translate(var(--px,0px),var(--py,0px)) translateY(0) rotate(-4deg); }
    50%{ transform:translate(var(--px,0px),var(--py,0px)) translateY(-22px) rotate(3deg); }
    100%{ transform:translate(var(--px,0px),var(--py,0px)) translateY(0) rotate(-4deg); }
  }
  @media (max-width:760px){
    .orb-1{ height:140px; } .orb-2{ height:165px; }
    .orb-3{ height:115px; } .orb-4{ height:180px; } .orb-5{ height:95px; }
  }
  @media (max-width:520px){ .orb-3, .orb-5{ display:none; } }

  /* ---------- Section shell ---------- */
  section{ padding-block:80px; }
  .section-head{ max-width:620px; margin-bottom:44px; }
  .section-head.center{ margin-inline:auto; text-align:center; }
  .section-head h2{ font-size:clamp(30px,4vw,42px); margin-top:10px; }
  .section-head p{ color:var(--ink-soft); margin-top:14px; font-size:15.5px; }

  .divider{ display:flex; align-items:center; justify-content:center; gap:16px; }
  .divider::before, .divider::after{ content:""; flex:1; max-width:200px; height:1px; background:linear-gradient(90deg, transparent, var(--accent), transparent); opacity:.5; }
  .divider-mark{ width:6px; height:6px; background:var(--accent); transform:rotate(45deg); flex:0 0 auto; }

  [data-reveal]{ opacity:0; transform:translateY(26px); transition:opacity .8s cubic-bezier(.2,.7,.3,1), transform .8s cubic-bezier(.2,.7,.3,1); }
  [data-reveal].revealed{ opacity:1; transform:translateY(0); }

  /* ---------- Concept ---------- */
  .concept-grid{ display:grid; grid-template-columns:1fr 1fr; gap:52px; align-items:center; }
  @media (max-width:820px){ .concept-grid{ grid-template-columns:1fr; } }
  .concept-text p{ color:var(--ink-soft); font-size:15.5px; margin-bottom:16px; }
  .concept-chips{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
  .concept-chip{
    display:flex; align-items:center; gap:8px; padding:9px 16px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); font-size:12.5px; color:var(--ink-soft); font-weight:600;
  }
  .concept-chip svg{ width:15px; height:15px; color:var(--accent); }
  .concept-visual{
    aspect-ratio:1/1; border-radius:var(--radius-lg); border:1px solid var(--line);
    overflow:hidden; position:relative;
  }
  .concept-visual img{ width:100%; height:100%; object-fit:cover; }

  /* ---------- Menu ---------- */
  /* ---------- Menu: white "island" section with light-green-outlined cards ---------- */
  #menu{
    background:#FFFFFF; border-radius:32px; margin-inline:12px; padding-inline:20px;
    --menu-border:#D5E2D0; --menu-accent:#5E7F52; --menu-ink:#111111; --menu-ink-soft:#7C8A76;
  }
  #menu .eyebrow{ color:var(--menu-accent); }
  #menu .section-head h2{ color:var(--menu-ink); }
  #menu .section-head p{ color:var(--menu-ink-soft); }
  .menu-tabs{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:36px; }
  .menu-tab{
    padding:11px 22px; border-radius:999px; border:1px solid var(--menu-border); background:#FFFFFF;
    color:var(--menu-ink-soft); font-size:13.5px; font-weight:700; cursor:pointer;
    transition:transform .18s cubic-bezier(.25,1,.35,1), background .18s ease, color .18s ease, border-color .18s ease;
  }
  .menu-tab[aria-pressed="true"]{ background:var(--menu-accent); color:#FFFFFF; border-color:var(--menu-accent); transform:scale(1.06); }
  .menu-tab:active{ transform:scale(1.1); }
  .drink-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:32px; }
  @media (max-width:900px){ .drink-grid{ grid-template-columns:repeat(2,1fr); gap:24px; } }
  @media (max-width:520px){ .drink-grid{ grid-template-columns:1fr; } }
  .drink-card{
    border-radius:20px; padding:36px 26px 30px; border:1px solid var(--menu-border); background:#FFFFFF;
    text-align:center; transition:transform .22s cubic-bezier(.25,1,.35,1), box-shadow .22s ease;
    display:flex; flex-direction:column; align-items:center;
  }
  .drink-card:hover{ transform:translateY(-5px); box-shadow:0 16px 34px -18px rgba(94,127,82,.35); }
  .drink-icon{
    width:150px; height:150px; border-radius:50%; margin-bottom:26px; overflow:hidden;
    background:#F4F7F1; display:flex; align-items:center; justify-content:center;
  }
  .drink-icon img{ width:100%; height:100%; object-fit:cover; }
  .drink-card h4{ font-family:var(--font-body); font-size:20px; font-weight:700; margin-bottom:8px; color:var(--menu-ink); }
  .drink-card p{ font-size:13.5px; color:var(--menu-ink-soft); margin-bottom:22px; }
  .drink-btn{
    display:inline-flex; align-items:center; justify-content:center; margin-top:auto; text-decoration:none;
    padding:10px 22px; border-radius:999px; border:1px solid var(--menu-border); background:transparent;
    color:var(--menu-accent); font-size:12.5px; font-weight:700; letter-spacing:.02em;
    transition:transform .18s cubic-bezier(.25,1,.35,1), background .18s ease;
  }
  .drink-btn:hover{ background:#F4F7F1; }
  .drink-btn:active{ transform:scale(1.06); }
  .menu-food-note{
    display:flex; align-items:center; justify-content:center; gap:10px; margin-top:40px; padding-top:28px;
    border-top:1px solid var(--menu-border); font-size:14px; color:var(--menu-ink-soft); flex-wrap:wrap; text-align:center;
  }
  .menu-food-note svg{ width:18px; height:18px; color:var(--menu-accent); flex:0 0 auto; }
  .menu-food-note b{ color:var(--menu-ink); }
  .menu-note{
    text-align:center; margin-top:22px; font-size:13.5px; color:var(--menu-ink-soft); font-style:italic;
  }
  html[lang="ar"] .menu-note{ font-style:normal; }

  /* ---------- Be the barista: drink builder ---------- */
  .barista-tabs{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-bottom:36px; }
  .barista-tab{
    padding:11px 26px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); font-size:13.5px; font-weight:700; cursor:pointer;
    transition:transform .18s cubic-bezier(.25,1,.35,1), background .18s ease, color .18s ease, border-color .18s ease;
  }
  .barista-tab[aria-pressed="true"]{ background:var(--accent); color:var(--primary-ink); border-color:var(--accent); transform:scale(1.06); }
  .barista-tab:active{ transform:scale(1.1); }
  .builder{ display:grid; grid-template-columns:1.1fr .9fr; gap:44px; align-items:start; }
  @media (max-width:860px){ .builder{ grid-template-columns:1fr; } }
  .builder-controls{ display:flex; flex-direction:column; gap:22px; }
  .builder-group-label{
    display:block; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);
    margin-bottom:10px; font-weight:700;
  }
  html[lang="ar"] .builder-group-label{ letter-spacing:.02em; text-transform:none; }
  .builder-options{ display:flex; flex-wrap:wrap; gap:8px; }
  .builder-chip{
    padding:9px 17px; border-radius:999px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer;
    transition:transform .18s cubic-bezier(.25,1,.35,1), background .18s ease, color .18s ease, border-color .18s ease;
  }
  .builder-chip[aria-pressed="true"]{ background:var(--accent); color:var(--primary-ink); border-color:var(--accent); transform:scale(1.06); }
  .builder-chip:active{ transform:scale(1.1); }
  .builder-preview{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:34px 30px;
    text-align:center; box-shadow:var(--shadow-sm); display:flex; flex-direction:column; align-items:center; gap:16px;
    position:sticky; top:100px;
  }
  .builder-cup-svg{ width:110px; height:145px; color:var(--ink-soft); overflow:visible; }
  #builderLiquidFill{ fill:#6B4226; transition:fill .3s ease; }
  .builder-ice{ opacity:0; transition:opacity .25s ease; }
  .builder-ice rect{ fill:#fff; opacity:.55; transition:opacity .25s ease; }
  .builder-steam{ opacity:0; transition:opacity .25s ease; color:var(--ink-soft); }
  .builder-steam path{ transform-origin:center bottom; animation:builderSteamRise 3s ease-in-out infinite; }
  .builder-steam path:last-child{ animation-delay:.6s; }
  @keyframes builderSteamRise{ 0%,100%{ opacity:.35; transform:translateY(0); } 50%{ opacity:.85; transform:translateY(-4px); } }
  @media (prefers-reduced-motion: reduce){ .builder-steam path{ animation:none; } }
  .builder-name{ font-size:21px; }
  .builder-specs{ width:100%; max-width:280px; margin:0 auto; }
  .builder-spec-row{
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px; text-align:start;
  }
  .builder-spec-row dt{ margin:0; color:var(--ink-soft); }
  .builder-spec-row dd{ margin:0; font-weight:700; color:var(--ink-heading); text-align:end; }
  .builder-actions{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:4px; }
  .builder-actions .btn{ padding:11px 20px; font-size:13px; }
  .builder-note{ font-size:12px; color:var(--ink-soft); font-style:italic; max-width:320px; }
  html[lang="ar"] .builder-note{ font-style:normal; }
  @media (max-width:860px){ .builder-preview{ position:static; } }

  .visit-note{ font-size:12px; color:var(--ink-soft); font-style:italic; margin-top:6px; }
  html[lang="ar"] .visit-note{ font-style:normal; }

  /* ---------- Why choose us ---------- */
  .why-heading{
    text-align:center; font-size:clamp(20px,2.6vw,26px); margin-top:64px; margin-bottom:28px;
    color:var(--ink-heading);
  }
  .why-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
  @media (max-width:860px){ .why-grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:480px){ .why-grid{ grid-template-columns:1fr; } }
  .why-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    padding:24px 20px; text-align:center;
  }
  .why-card svg{ width:26px; height:26px; color:var(--accent); margin-bottom:12px; }
  .why-card h4{ font-size:15px; margin-bottom:6px; }
  .why-card p{ font-size:13px; color:var(--ink-soft); }

  /* ---------- Follow ---------- */
  .follow-grid{ display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:640px; margin-inline:auto; }
  @media (max-width:560px){ .follow-grid{ grid-template-columns:1fr; } }
  .follow-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); padding:28px;
    text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .follow-card svg{ width:30px; height:30px; color:var(--accent); }
  .follow-card h3{ font-size:17px; }
  .follow-card p{ font-size:13px; color:var(--ink-soft); }

  footer.site-footer{ padding:44px 0 30px; border-top:1px solid var(--line); }
  .footer-grid{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:32px; margin-bottom:24px; }
  .footer-col h4{ font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:10px; font-weight:700; }
  html[lang="ar"] .footer-col h4{ letter-spacing:.02em; text-transform:none; }
  .footer-col p, .footer-col a{ font-size:13.5px; color:var(--ink-soft); text-decoration:none; display:block; margin-bottom:4px; }
  .footer-col .btn{ display:inline-flex; color:var(--primary-ink); margin-bottom:0; }
  footer.site-footer .bottom{ font-size:12px; color:var(--ink-soft); text-align:center; padding-top:20px; border-top:1px solid var(--line); }

  @media (prefers-reduced-motion: reduce){
    *{ transition-duration:.001ms !important; animation-duration:.001ms !important; }
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="i-cup"><path d="M4 8h13v6a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M17 9h1.5a2.8 2.8 0 0 1 0 5.6H17" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 4c-.6.8-.6 1.4 0 2M12 4c-.6.8-.6 1.4 0 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></g>
    <g id="i-pin"><path d="M12 22s7-6.4 7-12a7 7 0 1 0-14 0c0 5.6 7 12 7 12z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/></g>
    <g id="i-clock"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></g>
    <g id="i-phone"><path d="M6.5 3.5h3l1.5 4-2 1.5a12 12 0 0 0 6 6l1.5-2 4 1.5v3c0 1-1 2-2 2C11.5 19.5 4.5 12.5 4.5 5.5c0-1 1-2 2-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></g>

  var state = { lang:"en" };
  try{
    var saved = localStorage.getItem("savva_lang");
    if(saved === "en" || saved === "ar") state.lang = saved;
  }catch(e){}

  function t(key){
    var dict = STRINGS[state.lang] || STRINGS.en;
    return dict[key] !== undefined ? dict[key] : (STRINGS.en[key] || "");
  }

  var ICON_VIEWBOX = {
    "i-cup":"0 0 24 24","i-pin":"0 0 24 24","i-clock":"0 0 24 24","i-phone":"0 0 24 24",
    "i-instagram":"0 0 24 24","i-music":"0 0 24 24","i-users":"0 0 24 24","i-trees":"0 0 24 24",
    "i-leaf":"0 0 24 24","i-arrow":"0 0 24 24","i-menu":"0 0 24 24","i-close":"0 0 24 24",
    "i-copy":"0 0 24 24"
  };
  function hydrateIcons(root){
    if(!root) return;
    root.querySelectorAll("svg").forEach(function(svg){
      var use = svg.querySelector("use");
      if(!use) return;
      var id = use.getAttribute("href").replace("#","");
      if(ICON_VIEWBOX[id] && !svg.getAttribute("viewBox")) svg.setAttribute("viewBox", ICON_VIEWBOX[id]);
    });
  }

  function applyLanguage(){
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("#langSwitch button").forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === state.lang ? "true" : "false");
    });
    try{ localStorage.setItem("savva_lang", state.lang); }catch(e){}
  }

  /* =====================================================
     DRINK MENU — tabbed category grid
     ===================================================== */
  function renderDrinks(){
    var wrap = document.getElementById("drinkGrid");
    var html = MENU_ITEMS.filter(function(d){ return d.cat === activeMenuCat; }).map(function(d){
      return '<div class="drink-card">' +
        '<div class="drink-icon"><img src="' + d.img + '" alt="" loading="lazy"></div>' +
        '<h4>' + t(d.nameKey) + '</h4><p>' + t(d.descKey) + '</p>' +
        '<a class="drink-btn" href="https://www.instagram.com/savva_cafe" target="_blank" rel="noopener">' + t("drinkCta") + '</a>' +
        '</div>';
    }).join('');
    wrap.innerHTML = html;
    hydrateIcons(wrap);
  }
  document.getElementById("menuTabs").addEventListener("click", function(e){
    var btn = e.target.closest(".menu-tab");
    if(!btn) return;
    activeMenuCat = btn.getAttribute("data-cat");
    document.querySelectorAll("#menuTabs .menu-tab").forEach(function(b){
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    renderDrinks();
  });

  document.getElementById("langSwitch").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-lang]");
    if(!btn) return;
    state.lang = btn.getAttribute("data-lang");
    applyLanguage();
    renderDrinks();
    renderBuilder();
  });

  /* =====================================================
     BE THE BARISTA — build-your-own-drink tool. Pure front
     end fun: it doesn't place a real order (Savva has no
     online ordering system — see footer/menu notes), it just
     lets a visitor design a drink, then hands them a copyable
     recipe to bring or message to the café themselves.
     ===================================================== */
  var BUILDER_LABEL_KEYS = {
    base:{ espresso:"baseEspresso", matcha:"baseMatcha", fruitTea:"baseFruitTea", milk:"baseMilk" },
    milk:{ whole:"milkWhole", oat:"milkOat", almond:"milkAlmond", none:"milkNone" },
    sweet:{ none:"sweetNone", light:"sweetLight", regular:"sweetRegular", extra:"sweetExtra" },
    flavor:{ none:"flavorNone", vanilla:"flavorVanilla", caramel:"flavorCaramel", hazelnut:"flavorHazelnut", mint:"flavorMint", berry:"flavorBerry" },
    ice:{ light:"iceLight", regular:"iceRegular", extra:"iceExtra" }
  };
  var BUILDER_ICE_CUBES = { light:1, regular:2, extra:3 };
  var BUILDER_LIQUID_COLOR = { espresso:"#6B4226", matcha:"#7C9A5B", fruitTea:"#B23A4E", milk:"#EFE6D5" };
  var BUILDER_FLAVOR_TINT = { vanilla:"#F3D9A4", caramel:"#B97A32", hazelnut:"#8A5A34", mint:"#6FBF8B", berry:"#A83B57" };
  // category: "hot" or "cold" — two separate builders sharing one set of
  // controls; each remembers its own choices independently. Fruit Tea is
  // cold-only (that's how it's always served, per the real menu), so the
  // base chip is hidden and the base falls back to Espresso under Hot.
  var builderState = {
    hot:{ base:"espresso", milk:"whole", sweet:"light", flavor:"none" },
    cold:{ base:"espresso", milk:"whole", sweet:"light", flavor:"none", ice:"regular" }
  };
  var builderCategory = "hot";
  var builderSection = document.getElementById("barista");

  function builderLiquidColor(state){
    var base = BUILDER_LIQUID_COLOR[state.base];
    var tint = BUILDER_FLAVOR_TINT[state.flavor];
    if(!tint) return base;
    if(window.CSS && CSS.supports && CSS.supports("color", "color-mix(in srgb, red 50%, blue)")){
      return "color-mix(in srgb, " + base + " 65%, " + tint + " 35%)";
    }
    return tint;
  }

  function renderBuilder(){
    if(!builderSection) return;
    var state = builderState[builderCategory];
    var isCold = builderCategory === "cold";

    builderSection.querySelectorAll("#baristaTabs .barista-tab").forEach(function(tab){
      tab.setAttribute("aria-pressed", tab.getAttribute("data-cat") === builderCategory ? "true" : "false");
    });

    var fruitTeaChip = builderSection.querySelector('.builder-chip[data-value="fruitTea"]');
    if(fruitTeaChip) fruitTeaChip.hidden = !isCold;
    var iceGroup = document.getElementById("builderIceGroup");
    if(iceGroup) iceGroup.hidden = !isCold;

    builderSection.querySelectorAll(".builder-options").forEach(function(group){
      var key = group.getAttribute("data-group");
      group.querySelectorAll(".builder-chip").forEach(function(chip){
        chip.setAttribute("aria-pressed", chip.getAttribute("data-value") === state[key] ? "true" : "false");
      });
    });

    var liquid = document.getElementById("builderLiquidFill");
    if(liquid) liquid.style.fill = builderLiquidColor(state);
    var ice = document.getElementById("builderIce");
    if(ice){
      ice.style.opacity = isCold ? "1" : "0";
      var cubeCount = isCold ? BUILDER_ICE_CUBES[state.ice] : 0;
      ice.querySelectorAll("rect").forEach(function(cube){
        cube.style.opacity = (parseInt(cube.getAttribute("data-cube"), 10) <= cubeCount) ? "" : "0";
      });
    }
    var steam = document.getElementById("builderSteam");
    if(steam) steam.style.opacity = isCold ? "0" : "1";
    var straw = document.getElementById("builderStrawEl");
    if(straw) straw.style.opacity = isCold ? "1" : "0";

    var flavorWord = state.flavor !== "none" ? t(BUILDER_LABEL_KEYS.flavor[state.flavor]) : "";
    var milkWord = (state.milk === "oat" || state.milk === "almond") ? t(BUILDER_LABEL_KEYS.milk[state.milk]) : "";
    var tempWord = isCold ? t("tempIced") : "";
    var baseWord = t(BUILDER_LABEL_KEYS.base[state.base]);
    var nameParts = [tempWord, flavorWord, milkWord, baseWord].filter(Boolean);
    var nameEl = document.getElementById("builderName");
    if(nameEl) nameEl.textContent = nameParts.join(" ");

    var styleValue = isCold ? (t("tempIced") + " · " + t(BUILDER_LABEL_KEYS.ice[state.ice])) : t("tempHot");
    var specs = [
      [t("specBase"), t(BUILDER_LABEL_KEYS.base[state.base])],
      [t("specStyle"), styleValue],
      [t("specMilk"), t(BUILDER_LABEL_KEYS.milk[state.milk])],
      [t("specSweet"), t(BUILDER_LABEL_KEYS.sweet[state.sweet])],
      [t("specFlavor"), t(BUILDER_LABEL_KEYS.flavor[state.flavor])]
    ];
    var specsEl = document.getElementById("builderSpecs");
    if(specsEl){
      specsEl.innerHTML = specs.map(function(row){
        return '<div class="builder-spec-row"><dt>' + row[0] + '</dt><dd>' + row[1] + '</dd></div>';
      }).join("");
    }
  }

  if(builderSection){
    var baristaTabs = document.getElementById("baristaTabs");
    if(baristaTabs){
      baristaTabs.addEventListener("click", function(e){
        var tab = e.target.closest(".barista-tab");
        if(!tab) return;
        builderCategory = tab.getAttribute("data-cat");
        renderBuilder();
      });
    }
    builderSection.querySelectorAll(".builder-options").forEach(function(group){
      group.addEventListener("click", function(e){
        var chip = e.target.closest(".builder-chip");
        if(!chip || chip.hidden) return;
        var key = group.getAttribute("data-group");
        builderState[builderCategory][key] = chip.getAttribute("data-value");
        renderBuilder();
      });
    });
    var copyBtn = document.getElementById("builderCopyBtn");
    if(copyBtn){
      copyBtn.addEventListener("click", function(){
        var name = document.getElementById("builderName").textContent;
        var lines = Array.prototype.slice.call(document.querySelectorAll("#builderSpecs .builder-spec-row")).map(function(row){
          return row.querySelector("dt").textContent + ": " + row.querySelector("dd").textContent;
        });
        var text = name + "\n" + lines.join("\n");
        var label = copyBtn.querySelector("span");
        var original = label ? label.textContent : "";
        function showCopied(){
          if(label) label.textContent = t("builderCopied");
          setTimeout(function(){ if(label) label.textContent = original; }, 1600);
        }
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(showCopied, showCopied);
        }else{
          showCopied();
        }
      });
    }
  }

  var hamburgerBtn = document.getElementById("hamburgerBtn");
  var mobileNav = document.getElementById("mobileNav");
  hamburgerBtn.addEventListener("click", function(){
    var open = mobileNav.classList.toggle("open");
    hamburgerBtn.innerHTML = '<svg><use href="#' + (open ? "i-close" : "i-menu") + '"/></svg>';
    hydrateIcons(hamburgerBtn);

  mobileNav.querySelectorAll("a").forEach(function(a){
    a.addEventListener("click", function(){
      mobileNav.classList.remove("open");
      hamburgerBtn.innerHTML = '<svg><use href="#i-menu"/></svg>';
      hydrateIcons(hamburgerBtn);
    });
  });

  document.getElementById("visitDirectionsBtn").href = MAPS_URL;

  /* =====================================================
     NAV MAGNIFY — same dock-lens technique as body-sculptor
     ===================================================== */
  function initNavMagnify(){
    var nav = document.querySelector("nav.main-nav");
    if(!nav) return;
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduceMotion) return;
    var MAX_SCALE = 1.4, RADIUS = 85;
    nav.addEventListener("mousemove", function(e){
      nav.querySelectorAll("a").forEach(function(link){
        var rect = link.getBoundingClientRect();
        var center = rect.left + rect.width / 2;
        var dist = Math.abs(e.clientX - center);
        var scale = dist < RADIUS ? 1 + (MAX_SCALE - 1) * (1 - dist / RADIUS) : 1;
        link.style.transform = "scale(" + scale.toFixed(3) + ")";
      });
    });
    nav.addEventListener("mouseleave", function(){
      nav.querySelectorAll("a").forEach(function(link){ link.style.transform = "scale(1)"; });
    });
  }

  /* =====================================================
     HERO ORB PARALLAX — the floating drinks drift gently
     toward the cursor, closer orbs (higher data-depth) move
     more, so the composition reads as layered/3D. Smoothed
     with the same lerp approach as the canvas drift above,
     layered on top of each orb's own CSS float animation.
     ===================================================== */
  function initHeroOrbParallax(){
    var wrap = document.getElementById("heroOrbs");
    if(!wrap) return;
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(reduceMotion) return;
    var orbs = Array.prototype.slice.call(wrap.querySelectorAll(".drink-orb")).map(function(el){
      return { el:el, depth:parseFloat(el.getAttribute("data-depth")) || 0.5, x:0, y:0 };
    });
    var target = { x:0, y:0 };
    var hero = wrap.parentElement;

    hero.addEventListener("pointermove", function(e){
      var rect = hero.getBoundingClientRect();
      target.x = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
      target.y = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
    });
    hero.addEventListener("pointerleave", function(){ target.x = 0; target.y = 0; });

    function tick(){
      orbs.forEach(function(o){
        o.x += (target.x * o.depth * 16 - o.x) * 0.05;
        o.y += (target.y * o.depth * 12 - o.y) * 0.05;
        o.el.style.setProperty("--px", o.x.toFixed(2) + "px");
        o.el.style.setProperty("--py", o.y.toFixed(2) + "px");
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  /* =====================================================
     SCROLL REVEAL — fade+rise sections into view once
     ===================================================== */
  function initScrollReveal(){
    var els = document.querySelectorAll("[data-reveal]");
    var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!("IntersectionObserver" in window) || reduceMotion){
      els.forEach(function(el){ el.classList.add("revealed"); });
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){ entry.target.classList.add("revealed"); io.unobserve(entry.target); }
      });
    }, { threshold:0.15 });
    els.forEach(function(el){ io.observe(el); });
  }

  document.getElementById("year").textContent = new Date().getFullYear();
  hydrateIcons(document);
  applyLanguage();
  renderDrinks();
  renderBuilder();
  initNavMagnify();
  initHeroOrbParallax();
  initScrollReveal();
})();
